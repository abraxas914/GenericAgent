<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenericAgent — Emergency startup recovery</title>
<style>
:root{color-scheme:light dark;--ga-bg:#fff;--ga-text-0:#1c1f23;--ga-text-1:#5f6673;--ga-fill:#f5f6f7;--ga-border:#dcdee3;--ga-primary:#0064fa;--ga-primary-hover:#0052d9;--ga-danger:#d54941;--ga-danger-bg:#fff2f1;--ga-focus:#0064fa33;--ga-radius:6px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Microsoft YaHei UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--ga-bg:#16161a;--ga-text-0:#f2f3f5;--ga-text-1:#a9abb3;--ga-fill:#25262b;--ga-border:#3a3b41;--ga-primary:#54a9ff;--ga-primary-hover:#78b9ff;--ga-danger:#ff7770;--ga-danger-bg:#351f21;--ga-focus:#54a9ff40}}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--ga-bg);color:var(--ga-text-0)}body{display:grid;place-items:center;padding:32px 40px}main{width:min(100%,500px)}h1{margin:0 0 8px;font-size:22px;line-height:1.3}.ga-intro{margin:0 0 20px;color:var(--ga-text-1);font-size:14px;line-height:1.6}.ga-failure{display:none;margin-bottom:18px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--ga-danger) 28%,transparent);border-radius:var(--ga-radius);background:var(--ga-danger-bg)}.ga-failure.ga-visible{display:block}.ga-failure strong{display:block;margin-bottom:4px;color:var(--ga-danger);font-size:14px}.ga-failure span{font-size:13px;line-height:1.5}.ga-field{display:block;margin:0 0 15px}.ga-field-label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}.ga-field input{width:100%;height:36px;padding:0 12px;border:1px solid var(--ga-border);border-radius:var(--ga-radius);outline:0;background:var(--ga-fill);color:var(--ga-text-0);font:inherit;font-size:13px}.ga-field input:focus{border-color:var(--ga-primary);box-shadow:0 0 0 2px var(--ga-focus)}.ga-hint{display:block;margin-top:5px;color:var(--ga-text-1);font-size:12px;line-height:1.45}button{border:0;border-radius:var(--ga-radius);font:inherit;cursor:pointer}.ga-primary{width:100%;height:36px;margin-top:3px;background:var(--ga-primary);color:#fff;font-size:14px;font-weight:600}.ga-primary:hover{background:var(--ga-primary-hover)}.ga-primary:focus-visible,.ga-copy:focus-visible,summary:focus-visible{outline:2px solid var(--ga-primary);outline-offset:2px}.ga-primary:disabled{opacity:.6;cursor:wait}details{margin-top:20px;padding-top:14px;border-top:1px solid var(--ga-border)}summary{width:max-content;color:var(--ga-text-1);font-size:13px;cursor:pointer;user-select:none}.ga-diagnostics-actions{display:flex;align-items:center;gap:10px;margin:12px 0 8px}.ga-copy{height:30px;padding:0 10px;border:1px solid var(--ga-border);background:var(--ga-fill);color:var(--ga-text-0);font-size:12px}.ga-copy-status{color:var(--ga-text-1);font-size:12px}pre{max-height:190px;margin:0;padding:12px;overflow:auto;border:1px solid var(--ga-border);border-radius:var(--ga-radius);background:var(--ga-fill);color:var(--ga-text-0);font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}.ga-privacy{margin:9px 0 0;color:var(--ga-text-1);font-size:11px;line-height:1.45}.ga-rescue-note{margin:0 0 18px;color:var(--ga-text-1);font-size:12px}
</style>
</head>
<body>
<main>
  <h1 id="page-title">修复启动问题</h1>
  <p class="ga-intro" id="intro">恢复界面未能加载。你仍可检查本地位置、读取诊断并重试启动。</p>
  <p class="ga-rescue-note" id="rescue-note">此页面不依赖应用界面组件，可在前端资源损坏时独立运行。</p>
  <section class="ga-failure" id="failure" role="alert"><strong id="failure-title"></strong><span id="failure-description"></span></section>
  <label class="ga-field"><span class="ga-field-label" id="project-label">GenericAgent 文件夹</span><input id="project-dir" type="text" spellcheck="false" autocomplete="off"><span class="ga-hint" id="project-hint">选择包含 GenericAgent 的本地文件夹。</span></label>
  <label class="ga-field"><span class="ga-field-label" id="python-label">Python 解释器</span><input id="python-path" type="text" spellcheck="false" autocomplete="off"><span class="ga-hint" id="python-hint">通常会自动填写；使用虚拟环境时请选择其中的 Python 程序。</span></label>
  <button class="ga-primary" id="retry" type="button">重试启动</button>
  <details><summary id="diagnostics-label">诊断信息</summary><div class="ga-diagnostics-actions"><button class="ga-copy" id="copy" type="button">复制诊断信息</button><span class="ga-copy-status" id="copy-status" aria-live="polite"></span></div><pre id="diagnostics" tabindex="0">GenericAgent Desktop startup diagnostics</pre><p class="ga-privacy" id="privacy">诊断信息由启动服务脱敏后提供，包含本机路径和错误日志，不包含 API Key、会话或记忆内容。</p></details>
</main>
<script>
(function () {
'use strict';
var ZH=(navigator.language||'').toLowerCase().startsWith('zh');
var tauri=window.__TAURI__||{};
var invoke=tauri.core&&tauri.core.invoke;
var listen=tauri.event&&tauri.event.listen;
var projectInput=document.getElementById('project-dir');
var pythonInput=document.getElementById('python-path');
var retryButton=document.getElementById('retry');
var failureBox=document.getElementById('failure');
var failureTitle=document.getElementById('failure-title');
var failureDescription=document.getElementById('failure-description');
var diagnostics=document.getElementById('diagnostics');
var copyStatus=document.getElementById('copy-status');
var latestSnapshot=null;
var latestSeq=-1;
var failures={
config_unresolved:{zh:['未找到 GenericAgent','选择 GenericAgent 文件夹后重试。'],en:['GenericAgent not found','Select the GenericAgent folder and retry.']},
prepare_failed:{zh:['运行环境准备失败','本地运行环境未准备完成。请重试；如果问题持续，请检查诊断信息。'],en:['Runtime setup failed','The local runtime could not be prepared. Retry, then check diagnostics if it continues.']},
spawn_failed:{zh:['后台服务未能启动','请检查 GenericAgent 文件夹和 Python 解释器，然后重试。'],en:['Background service could not start','Check the GenericAgent folder and Python interpreter, then retry.']},
port_conflict:{zh:['本地连接被占用','另一个程序正在占用 GenericAgent 的本地连接。关闭相关程序后重试。'],en:['Local connection is in use','Another process is using GenericAgent’s local connection. Close it and retry.']},
service_timeout:{zh:['后台服务启动超时','服务没有在预期时间内就绪。请重试；如果问题持续，请展开诊断信息。'],en:['Background service timed out','The service did not become ready in time. Retry, then open diagnostics if it continues.']},
service_exited:{zh:['后台服务意外退出','服务启动后立即停止。诊断信息中包含退出状态和最近日志。'],en:['Background service exited','The service stopped immediately after launch. Diagnostics include its exit status and recent logs.']},
ui_navigation_failed:{zh:['主界面未能打开','后台服务已经就绪，但界面加载失败。请重试启动。'],en:['Main window could not open','The service is ready, but the interface failed to load. Retry startup.']},
unknown:{zh:['GenericAgent 未能启动','请重试；如果问题持续，请复制诊断信息进行排查。'],en:['GenericAgent could not start','Retry. If it continues, copy the diagnostics for troubleshooting.']}
};
if(!ZH){document.documentElement.lang='en';document.getElementById('page-title').textContent='Emergency startup recovery';document.getElementById('intro').textContent='The normal recovery interface could not load. You can still check local paths, read diagnostics, and retry.';document.getElementById('rescue-note').textContent='This standalone page does not depend on the application UI bundle.';document.getElementById('project-label').textContent='GenericAgent folder';document.getElementById('project-hint').textContent='Select the local folder that contains GenericAgent.';document.getElementById('python-label').textContent='Python interpreter';document.getElementById('python-hint').textContent='Usually filled automatically. If you use a virtual environment, select its Python executable.';retryButton.textContent='Retry startup';document.getElementById('diagnostics-label').textContent='Diagnostic details';document.getElementById('copy').textContent='Copy diagnostics';document.getElementById('privacy').textContent='Diagnostics are redacted by the startup service. They contain local paths and error logs, but no API keys, sessions, or memory content.'}
var guardReason='';try{guardReason=sessionStorage.getItem('ga-setup-fallback-reason')||'';sessionStorage.removeItem('ga-setup-fallback-reason')}catch(_){}
if(guardReason){copyStatus.textContent=(ZH?'恢复界面失败原因：':'Recovery UI failure: ')+guardReason}
function showFailure(failure){var code=failure&&failures[failure.code]?failure.code:'unknown';var copy=failures[code][ZH?'zh':'en'];failureTitle.textContent=copy[0];failureDescription.textContent=copy[1];failureBox.classList.add('ga-visible')}
function diagnosticsText(snapshot){var d=snapshot&&snapshot.diagnostics||{};var logs=Array.isArray(d.recentLogs)?d.recentLogs:[];return['GenericAgent Desktop startup diagnostics','time: '+new Date().toISOString(),'build_id: '+(d.buildId||''),'platform: '+(d.platform||''),'mode: '+(snapshot&&snapshot.mode||''),'phase: '+(snapshot&&snapshot.phase||''),'failure_code: '+(snapshot&&snapshot.failure&&snapshot.failure.code||''),'project_dir: '+(d.projectDir||''),'python_path: '+(d.pythonPath||''),'port_state: '+(d.portState||'unknown'),'bridge_identity: '+(d.bridgeIdentity||''),'error: '+(snapshot&&snapshot.failure&&snapshot.failure.detail||''),'recent_logs:'].concat(logs).join('\n')}
function renderSnapshot(snapshot){var seq=Number.isFinite(snapshot&&snapshot.seq)?snapshot.seq:latestSeq+1;if(seq<=latestSeq)return;latestSeq=seq;latestSnapshot=snapshot;if(snapshot&&snapshot.diagnostics&&snapshot.diagnostics.projectDir&&!projectInput.value)projectInput.value=snapshot.diagnostics.projectDir;if(snapshot&&snapshot.diagnostics&&snapshot.diagnostics.pythonPath&&!pythonInput.value)pythonInput.value=snapshot.diagnostics.pythonPath;if(snapshot&&snapshot.failure)showFailure(snapshot.failure);diagnostics.textContent=diagnosticsText(snapshot)}
async function refresh(){if(typeof invoke!=='function')throw new Error('Tauri bootstrap API is unavailable');var result=await Promise.all([invoke('get_config').catch(function(){return['','']}),invoke('get_bootstrap_snapshot')]);var config=result[0];if(config&&config[0])pythonInput.value=config[0];if(config&&config[1])projectInput.value=config[1];renderSnapshot(result[1])}
async function retry(){var projectDir=projectInput.value.trim();var pythonPath=pythonInput.value.trim();if(!projectDir){showFailure({code:'config_unresolved'});return}if(typeof invoke!=='function'){showFailure({code:'unknown'});return}retryButton.disabled=true;retryButton.textContent=ZH?'正在重试…':'Retrying…';copyStatus.textContent='';try{await invoke('retry_bootstrap',{pythonPath:pythonPath,projectDir:projectDir})}catch(_){var snapshot=await invoke('get_bootstrap_snapshot').catch(function(){return latestSnapshot});renderSnapshot(snapshot);retryButton.disabled=false;retryButton.textContent=ZH?'重试启动':'Retry startup'}}
async function copyDiagnostics(){var text=diagnostics.textContent||'';if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(text);copyStatus.textContent=ZH?'已复制，可粘贴给部署智能体排查。':'Copied. Paste it to your deployment agent for troubleshooting.';return}catch(_){}}var selection=window.getSelection();var range=document.createRange();range.selectNodeContents(diagnostics);selection.removeAllRanges();selection.addRange(range);diagnostics.focus();copyStatus.textContent=ZH?'请手动复制已选中的诊断信息。':'Copy the selected diagnostics manually.'}
retryButton.addEventListener('click',retry);document.getElementById('copy').addEventListener('click',copyDiagnostics);projectInput.addEventListener('keydown',function(event){if(event.key==='Enter')pythonInput.focus()});pythonInput.addEventListener('keydown',function(event){if(event.key==='Enter')retry()});
async function initialize(){if(typeof listen==='function')await listen('bootstrap',function(event){renderSnapshot(event.payload)});await refresh()}
initialize().catch(function(error){renderSnapshot({seq:latestSeq+1,mode:'cold_start',phase:'failed',stage:null,progress:0,failure:{code:'unknown',detail:String(error)},diagnostics:{buildId:'',platform:'',projectDir:'',pythonPath:'',recentLogs:[],portState:'unknown',bridgeIdentity:null}})});
}());
</script>
</body>
</html>
